<!DOCTYPE html>
<html lang="ko" data-theme="cupcake">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>광해군 사료 탐험</title>
<!-- 인터넷이 될 때만 불러오는 꾸미기용 파일 (없어도 아래 기본 CSS로 모두 작동) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*{box-sizing:border-box}
:root{--pink:#ff8fb1;--pink2:#ffe3ec;--sky:#6ec6f0;--sky2:#dff3fd;--ink:#3b3350;--mint:#5ccfa4;--warn:#ffb347}
html{font-size:18px}
body{margin:0;font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:18px;line-height:1.6;color:var(--ink);background:linear-gradient(160deg,#fff0f5,#e6f6ff);min-height:100vh;word-break:keep-all;overflow-wrap:anywhere}
.wrap{max-width:560px;margin:0 auto;padding:12px}
header{background:#fff;border-radius:24px;padding:12px 14px;box-shadow:0 4px 0 var(--pink2);margin-bottom:12px}
h1{font-size:1.2rem;margin:0 0 8px;display:flex;align-items:center;gap:8px;color:#e0527f}
.bar{height:16px;background:var(--sky2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--sky));border-radius:99px;transition:width .3s}
.pinfo{display:flex;justify-content:space-between;gap:8px;font-size:1rem;margin-top:4px;flex-wrap:wrap}
.box{background:#fff;border-radius:24px;padding:16px;box-shadow:0 4px 0 var(--sky2);margin-bottom:12px}
h2{font-size:1.15rem;margin:0 0 8px;display:flex;align-items:center;gap:8px}
svg{flex:none;vertical-align:middle}
.b{min-height:46px;padding:8px 16px;border:0;border-radius:99px;font:inherit;font-weight:700;color:#fff;background:var(--sky);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 3px 0 rgba(0,0,0,.12);max-width:100%}
.b:active{transform:translateY(2px);box-shadow:none}
.b.pk{background:var(--pink)}.b.gn{background:var(--mint)}.b.gy{background:#fff;color:var(--ink);border:2px solid var(--sky2)}
.b[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.row>.b{flex:1 1 130px}
.card{cursor:pointer;border:3px dashed var(--pink);background:#fff9fb;border-radius:24px;padding:16px;min-height:230px;position:relative}
.card .em{font-size:2.6rem;line-height:1.2}
.tag{display:inline-block;background:var(--pink2);color:#d03a6b;border-radius:99px;padding:0 12px;font-size:1rem;font-weight:700}
.badge{position:absolute;top:10px;right:10px;border-radius:99px;padding:0 10px;font-size:1rem;font-weight:700;color:#fff}
.badge.ok{background:var(--mint)}.badge.more{background:var(--warn)}
.pic{display:block;width:100%;height:auto;border-radius:16px;margin:8px 0;border:2px solid var(--pink2)}
.th{width:84px;height:auto;border-radius:10px;flex:none;border:2px solid var(--pink2)}
.gl{display:flex;gap:10px;align-items:flex-start}
.hint{color:#8a7fa3;font-size:1rem}
ul{padding-left:1.2em;margin:6px 0}li{margin:4px 0}
.gist{background:var(--sky2);border-radius:14px;padding:8px 12px;margin-top:8px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav .b{flex:0 0 auto}
.opt{width:100%;margin:6px 0;text-align:left;justify-content:flex-start;background:#fff;color:var(--ink);border:2px solid var(--sky2);font-weight:600}
.opt.good{background:#d8f6e9;border-color:var(--mint)}.opt.bad{background:#ffe0e0;border-color:#ff7d7d}
.fb{border-radius:16px;padding:10px 12px;margin-top:8px;background:#fff7e0}
.chip{min-height:44px;padding:4px 12px;border-radius:99px;border:2px solid var(--sky);background:#fff;color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.chip.on{background:var(--sky);color:#fff}
.pick{flex:1 1 140px;min-height:64px;border-radius:18px;border:3px solid var(--pink2);background:#fff;font:inherit;color:var(--ink);cursor:pointer;padding:6px 8px;text-align:center}
.pick.on{border-color:var(--pink);background:var(--pink2);font-weight:700}
.big{font-size:2.2rem;font-weight:800;color:#e0527f;text-align:center;letter-spacing:4px}
.sc{font-size:3rem;font-weight:800;text-align:center;color:var(--pink)}
.axis{border-top:2px dotted var(--pink2);padding-top:10px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="ttl"></h1>
    <div class="bar"><i id="pb" style="width:0"></i></div>
    <div class="pinfo"><span id="pt"></span><span id="pt2"></span></div>
  </header>
  <main id="app"></main>
</div>

{e:'🌾',t:'대동법을 시행하다',gist:'특산물 대신 땅 크기에 따라 쌀을 내게 해 가난한 농민의 짐을 덜었어요.',
 pts:['예전에는 지역 특산물을 나라에 바치는 공납이 있었어요.','방납의 폐단: 중간 업자와 관리가 짜고, 구하기 힘든 물건을 정해 놓고 터무니없이 비싼 값을 받았어요.','광해군은 즉위년(1608년)에 이원익의 건의를 받아들였어요.','집집마다 거두던 공물 대신, 토지 결수(땅의 크기)를 기준으로 쌀을 거두는 대동법(선혜법)을 경기도에서 처음 시행했어요.','땅이 없거나 적은 가난한 농민의 부담이 크게 줄었어요.','공인(나라가 정한 구매 대행 상인)이 나타나고, 상품 화폐 경제(돈과 시장 중심 거래)가 발전하는 계기가 되었어요.']},
{e:'🧭',t:'중립 외교를 실시하다',gist:'명과 후금 사이에서 전쟁을 피하려고 상황을 보며 움직였어요.',
 pts:['명나라가 후금을 치려고 구원병을 보내라고 하자, 광해군은 전쟁으로 약해진 나라 힘과 서투른 군사를 이유로 경솔한 출병을 피하려 했어요.','의주 등 국경에 진을 쳐 군사력을 보여 주며 돌아가는 분위기(정세)를 지켜보았어요.','어쩔 수 없이 강홍립을 도원수로 삼아 군사를 보냈지만, 현장 상황에 따라 유연하게 대처하라는 밀지(비밀 명령)를 내렸어요.','후금과 비밀 교섭도 이어 가며 국경 충돌을 막으려 했어요.']},
{e:'👑',t:'광해군의 폐위와 인조반정',gist:'왕권을 지키려다 비판을 받았고, 결국 1623년 왕에서 쫓겨났어요.',

{e:'📜',t:'광해군 인물 카드: 세자 시절과 다른 활동',gist:'세자 때의 활약과 즉위 뒤 다른 활동, 가족과 평가를 알 수 있어요.',
 brief:['1575~1641년, 조선 사람이에요.','1592년 임진왜란 때 세자가 되어 전국을 돌며 의병을 격려했어요.','1597년 정유재란 때 군사를 격려하고 군수물자를 구했어요.','1608년 붕당 중 북인의 지지로 왕이 되었어요.','선혜청을 두고 사고를 정비했어요.','가족: 아버지 선조, 어머니 공빈 김씨, 아들 이질, 형 임해군','평가: 세자 시절의 활약과 중립 외교는 좋게, 도덕적으로 옳지 않은 행동은 나쁘게 평가해요.'],
 pts:['<b>태어나고 세상을 떠난 해</b>: 1575년~1641년, 나라는 조선이에요.','1592년(선조 25년) 임진왜란이 일어나자 나라의 어려움에 대비한다는 뜻으로 세자가 되었어요. 아버지 선조를 대신해 왕의 일을 돕고, 전국을 돌며 의병을 격려했어요.','1597년 정유재란이 일어나자 전라도와 경상도로 내려가 군사들을 격려하고 군수물자를 구했어요.','1608년 붕당 중 북인의 지지로 왕이 되었어요. 왕이 된 뒤 선혜청을 두고, 사고를 정비했어요. 전쟁 뒤 정치를 안정시키려 애썼어요.','<b>가족</b>: 아버지 선조, 어머니 공빈 김씨, 아들 이질, 형 임해군이에요.','<b>평가</b>: 세자 시절의 활약과 현실을 중시한 중립 외교 같은 좋은 평가와, 왕으로서 저지른 도덕적으로 옳지 않은 행동에 대한 나쁜 평가가 함께 있어요.']}];

const Q=[
{q:'광해군이 나라의 인구와 군대에 갈 사람을 정확히 알려고 시행한 제도는?',o:['호패법','대동법','화기도감','인조반정'],e:'호패법으로 인구와 군대에 복무할 사람을 정확히 파악해 군사 손실을 막으려 했어요. (사료 1)'},
{q:'광해군 2년(1610년)에 「동의보감」을 완성해 바친 사람은?',o:['허준','이원익','강홍립','영창대군'],e:'허준이 25권의 「동의보감」을 완성했고, 광해군이 전국에 널리 나눠 주게 했어요. (사료 2)'},
{q:'대동법은 무엇을 기준으로 쌀을 거두는 제도일까요?',o:['토지 결수(땅의 크기)','집의 개수','가족의 수','특산물의 종류'],e:'집마다 거두던 공물 대신 땅의 크기를 기준으로 쌀을 거두었어요. 가난한 농민의 부담이 줄었어요. (사료 3)'},
{q:'광해군이 명나라에 군사를 보낼 때 도원수로 삼은 사람은?',o:['강홍립','허준','이원익','임해군'],e:'강홍립을 도원수로 삼고, 상황에 맞게 유연하게 하라는 밀지를 내렸어요. (사료 4)'},
{q:'영창대군을 제거하고 인목대비를 서쪽 궁궐에 가둔 일을 무엇이라 부를까요?',o:['폐모살제','호패법','방납의 폐단','중립 외교'],e:'‘폐모살제’는 어머니(인목대비)를 내치고 동생(영창대군)을 죽였다는 뜻으로, 비판받은 일이에요. (사료 5)'},
{q:'1623년 광해군을 왕에서 쫓아낸 사건과, 그 일을 일으킨 세력은?',o:['인조반정 – 서인','인조반정 – 후금','중립 외교 – 서인','대동법 – 서인'],e:'성리학적 명분을 강조한 서인 세력이 인조를 왕으로 세운 인조반정이에요. (사료 5)'}];

/* 상태 */
let st='learn',order=[0,1,2,3,4,5],pos=0,open=false,mode='all',marks={},mb={},ev={EI:[],NS:[],TF:[],JP:[]},qz=null,lastWrong=[];
const nMark=()=>Object.keys(marks).length;
const deck=()=>mode==='more'?order.filter(i=>marks[i]==='more'):order;
const lv=()=>document.querySelectorAll('.nothing');

function head(){
 const t={learn:['book','사료 탐험'],mbti:['help','광해군 MBTI 추리'],quiz:['star','퀴즈 도전'],review:['redo','틀린 문제 보기'],result:['star','결과']}[st];
 $('ttl').innerHTML=ic(t[0],26)+' 광해군 '+t[1];
 $('pb').style.width=(nMark()/6*100)+'%';
 $('pt').textContent='사료 학습 '+nMark()+' / 6개';
 const ok=Object.values(marks).filter(v=>v==='ok').length;
 $('pt2').textContent='이해했어요 '+ok+'개';
}
function go(s){st=s;draw()}
function draw(){head();({learn,mbti,quiz,review,result})[st]();window.scrollTo(0,0)}

/* 1단계: 사료 카드 */
function learn(){
 const d=deck(),more=Object.values(marks).filter(v=>v==='more').length;
 let h=`<div class="box"><div class="row" style="margin-top:0">
 <button class="b pk" onclick="shuf()">${ic('shuffle')} 카드 섞기</button>
 <button class="b ${mode==='more'?'gn':'gy'}" onclick="tog()">${ic('eye')} ${mode==='more'?'전체 보기':'더 볼래요만 보기 ('+more+')'}</button></div>`;
 if(!d.length){
  h+=`<p>‘더 볼래요’로 고른 카드가 아직 없어요. 전체 카드로 돌아가 볼까요?</p><button class="b" onclick="tog()">전체 보기</button></div>`;
 }else{
  if(pos>=d.length)pos=d.length-1;
  const i=d[pos],s=S[i],m=marks[i];
  h+=`<div class="hint" style="margin-bottom:6px">카드를 눌러 설명을 열고 닫아요 👇</div>
  <div class="card" onclick="flip()">${m?`<span class="badge ${m}">${m==='ok'?'이해했어요':'더 볼래요'}</span>`:''}
  <span class="tag">사료 ${i+1}</span>
  <img class="pic" src="${IMG[i]}" alt="사료 ${i+1} 그림: ${s.t}">
  ${open?`<h2 style="margin-top:8px">${s.e} ${s.t}</h2><ul>${s.pts.map(p=>'<li>'+p+'</li>').join('')}</ul><div class="gist">💡 ${s.gist}</div>`
  :`<h2>${s.e} ${s.t}</h2><p class="hint">${ic('eye',20)} 눌러서 설명 보기</p>`}</div>
  <div class="row"><button class="b gn" onclick="mark('ok')">${ic('check')} 이해했어요</button><button class="b pk" onclick="mark('more')">${ic('eye')} 더 볼래요</button></div>
  <div class="nav"><button class="b gy" onclick="mv(-1)" ${pos==0?'disabled':''}>${ic('left')} 이전</button><b>${pos+1} / ${d.length}</b><button class="b gy" onclick="mv(1)" ${pos>=d.length-1?'disabled':''}>다음 ${ic('right')}</button></div></div>`;
 }
 h+=`<div class="box"><button class="b" style="width:100%" onclick="go('mbti')" ${nMark()<6?'disabled':''}>${ic('help')} 광해군 MBTI 추리하러 가기</button>
 ${nMark()<6?'<p class="hint" style="margin:6px 0 0">6개 사료에 모두 ‘이해했어요’나 ‘더 볼래요’를 누르면 열려요.</p>':''}</div>`;
 $('app').innerHTML=h;
}
const flip=()=>{open=!open;draw()};
const mv=n=>{pos+=n;open=false;draw()};
const shuf=()=>{order=sh(order);pos=0;open=false;draw()};
const tog=()=>{mode=mode==='more'?'all':'more';pos=0;open=false;draw()};
function mark(v){
 marks[deck()[pos]]=v;open=false;
 const d=deck();
 if(mode==='more'&&v==='ok'){ if(!d.length){pos=0}else if(pos>=d.length)pos=d.length-1 }
 else if(pos<d.length-1)pos++;
 draw();
}

/* 2단계: MBTI 추리 */
function mbti(){
 let h=`<div class="box"><h2>${ic('help')} 광해군의 MBTI는?</h2><p>사료를 읽고 광해군과 더 가까운 쪽을 고르세요. 그리고 ‘근거’가 된 사료를 눌러 표시해요. <b>정답은 없어요!</b> 사료로 이유를 말하는 게 중요해요.</p></div>`;
 M.forEach(a=>{
  const sel=mb[a.k],e=ev[a.k];
  h+=`<div class="box"><h2>${MT[a.k]}</h2><div class="row">`;
  [a.a,a.b].forEach(c=>{h+=`<button class="pick ${sel===c[0]?'on':''}" onclick="pk('${a.k}','${c[0]}')"><b>${c[0]} ${c[1]}</b><br><span class="hint">${c[2]}</span></button>`});
  h+=`</div><div class="axis"><b>근거 사료 고르기</b><div class="row">`;
  for(let i=0;i<6;i++)h+=`<button class="chip ${e.includes(i)?'on':''}" onclick="ce('${a.k}',${i})">사료 ${i+1}</button>`;
  h+=`</div>`;
  if(e.length)h+=e.sort().map(i=>`<div class="gist gl"><img class="th" src="${IMG[i]}" alt=""><span><b>사료 ${i+1}</b>: ${S[i].gist}${S[i].brief?'<ul>'+S[i].brief.map(p=>'<li>'+p+'</li>').join('')+'</ul>':''}</span></div>`).join('');
  else h+=`<p class="hint">근거로 쓴 사료를 눌러 보세요.</p>`;
  h+=`</div></div>`;
 });
 const done=M.every(a=>mb[a.k]);
 h+=`<div class="box"><div class="big">${done?M.map(a=>mb[a.k]).join(''):'????'}</div><p style="text-align:center;margin:4px 0 10px">내가 추리한 광해군의 MBTI</p>
 <div class="row"><button class="b gy" onclick="go('learn')">${ic('left')} 사료로 돌아가기</button><button class="b" onclick="startQ(Q)" ${done?'':'disabled'}>${ic('star')} 퀴즈 시작</button></div>
 ${done?'':'<p class="hint" style="margin:0">4가지를 모두 고르면 퀴즈로 갈 수 있어요.</p>'}</div>`;
 $('app').innerHTML=h;
}
const pk=(k,v)=>{mb[k]=v;draw()};
const ce=(k,i)=>{const e=ev[k],j=e.indexOf(i);j<0?e.push(i):e.splice(j,1);const y=window.scrollY;draw();window.scrollTo(0,y)};

/* 3단계: 퀴즈 */
function startQ(list){
 qz={list:sh(list),i:0,score:0,wrong:[],sel:null,opts:null,full:list===Q};
 go('quiz');
}
function quiz(){
 const c=qz.list[qz.i];
 if(!qz.opts)qz.opts=sh(c.o);
 const ans=qz.sel!==null;
 let h=`<div class="box"><span class="tag">${qz.i+1} / ${qz.list.length} 번째 문제</span><h2 style="margin-top:8px">${c.q}</h2>`;
 qz.opts.forEach((o,k)=>{
  let cl='opt';
  if(ans){if(o===c.o[0])cl+=' good';else if(k===qz.sel)cl+=' bad'}
  h+=`<button class="b ${cl}" onclick="pick(${k})" ${ans?'disabled':''}>${ans&&o===c.o[0]?ic('check'):ans&&k===qz.sel?ic('x'):''} ${o}</button>`;
 });
 if(ans){
  const r=qz.opts[qz.sel]===c.o[0];
  h+=`<div class="fb"><b>${r?'⭕ 정답이에요!':'❌ 아쉬워요. 정답은 “'+c.o[0]+'”'}</b><br>${c.e}</div>
  <button class="b" style="width:100%;margin-top:10px" onclick="nextQ()">${qz.i+1<qz.list.length?'다음 문제 '+ic('right'):'결과 보기 '+ic('star')}</button>`;
 }
 $('app').innerHTML=h+'</div>';
}
function pick(k){
 if(qz.sel!==null)return;
 qz.sel=k;const c=qz.list[qz.i];
 qz.opts[k]===c.o[0]?qz.score++:qz.wrong.push(c);
 draw();
}
function nextQ(){
 if(qz.i+1<qz.list.length){qz.i++;qz.sel=null;qz.opts=null;draw()}
 else{lastWrong=qz.wrong;go('result')}
}
function result(){
 const n=qz.list.length,pt=Math.round(qz.score/n*100);
 let t='🐣 다시 도전하는 병아리';
 if(pt>=90)t='🏆 광해군 박사';else if(pt>=80)t='🧭 사료 탐험가';else if(pt>=50)t='🌱 새싹 역사가';
 $('app').innerHTML=`<div class="box" style="text-align:center"><h2 style="justify-content:center">${ic('star')} 결과</h2>
 <div class="sc">${qz.full?pt+'점':qz.score+' / '+n}</div><p>${n}문제 중 <b>${qz.score}개</b>를 맞혔어요.</p>
 ${qz.full?`<div class="big" style="font-size:1.6rem;letter-spacing:0">${t}</div>`:''}
 <div class="row"><button class="b pk" onclick="startQ(Q)">${ic('redo')} 다시 풀기</button>
 <button class="b gn" onclick="go('review')" ${lastWrong.length?'':'disabled'}>${ic('eye')} 틀린 문제 보기 (${lastWrong.length})</button></div>
 <button class="b gy" onclick="go('learn')">${ic('book')} 사료 다시 보기</button></div>`;
}
function review(){
 let h=`<div class="box"><h2>${ic('redo')} 틀린 문제 모아 보기</h2>`;
 if(!lastWrong.length)h+='<p>틀린 문제가 없어요. 대단해요! 🎉</p>';
 lastWrong.forEach((c,i)=>{h+=`<div class="axis"><b>${i+1}. ${c.q}</b><div class="gist">정답: <b>${c.o[0]}</b><br>${c.e}</div></div>`});
 h+=`<div class="row">${lastWrong.length?`<button class="b pk" onclick="startQ(lastWrong)">${ic('redo')} 틀린 문제만 다시 풀기</button>`:''}<button class="b gy" onclick="go('result')">${ic('left')} 결과로</button></div></div>`;
 $('app').innerHTML=h;
}
draw();
</script>
</body>
</html>
